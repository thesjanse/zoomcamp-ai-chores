{% extends "accounts/base.html" %}

{% block title %}Delete {{ chore.title }}{% endblock %}

{% block content %}
<h1>Delete Chore</h1>
<p>Are you sure you want to delete "{{ chore.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'chore_list' %}">Cancel</a>
</form>
{% endblock %}
