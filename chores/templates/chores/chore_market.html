{% extends "accounts/base.html" %}

{% block title %}Chore Market{% endblock %}

{% block content %}
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<h1>Chore Market</h1>
<ul>
    {% for chore in chores %}
    <li>
        <a href="{% url 'chore_detail' chore.pk %}">{{ chore.title }}</a>
        <form method="post" hx-post="{% url 'chore_claim' chore.pk %}" hx-target="closest li" hx-swap="outerHTML">{% csrf_token %}<button>Claim</button></form>
    </li>
    {% empty %}
    <li>No chores available to claim.</li>
    {% endfor %}
</ul>
{% endblock %}
