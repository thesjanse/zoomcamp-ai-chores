{% extends "accounts/base.html" %}

{% block title %}{% if chore %}Edit Chore{% else %}New Chore{% endif %}{% endblock %}

{% block content %}
<h1>{% if chore %}Edit Chore{% else %}New Chore{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'chore_list' %}">Cancel</a>
</form>
{% endblock %}
