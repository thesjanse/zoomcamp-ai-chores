{% extends "accounts/base.html" %}

{% block title %}Password Reset{% endblock %}

{% block content %}
<h1>Password Reset</h1>
<p>Enter your email address and we'll send you a link to reset your password.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send Reset Link</button>
</form>
{% endblock %}
