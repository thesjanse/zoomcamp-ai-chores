{% extends "accounts/base.html" %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<h1>Set New Password</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Set New Password</button>
</form>
{% else %}
<p>The password reset link is invalid or has expired. Please <a href="{% url 'password_reset' %}">request a new one</a>.</p>
{% endif %}
{% endblock %}
